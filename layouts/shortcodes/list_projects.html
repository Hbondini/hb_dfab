<section class="portfolio-grid">
  {{ range where site.RegularPages "Section" "projects" }}
    <div class="project-card">
      <a href="{{ .RelPermalink }}">
        {{ if .Params.image }}
          <img src="{{ .Params.image }}" alt="{{ .Title }}">
        {{ end }}
        <h3>{{ .Title }}</h3>
        <p>{{ .Params.description }}</p>
      </a>
    </div>
  {{ end }}
</section>
