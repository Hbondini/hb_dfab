<section class="portfolio-grid">
  {{ with site.GetPage "/projects" }}
    {{ range .Pages }}
      <div class="project-card">
        <a href="{{ .RelPermalink }}">
          {{ if .Params.image }}
            <img src="{{ .Params.image }}" alt="{{ .Title }}">
          {{ end }}
          <h3>{{ .Title }}</h3>
          <p>{{ .Params.description }}</p>
        </a>
      </div>
    {{ end }}
  {{ end }}
</section>
