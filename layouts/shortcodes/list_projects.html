<section class="portfolio-grid">
  {{  := .Site.GetPage "section" "projects" }}
  {{ range .Pages }}
    <div class="project-card">
      <a href="{{ .RelPermalink }}">
        {{ if .Params.image }}
          <img src="{{ .Params.image }}" alt="{{ .Title }}">
        {{ end }}
        <h3>{{ .Title }}</h3>
        <p>{{ .Params.description }}</p>
      </a>
    </div>
  {{ end }}
</section>
