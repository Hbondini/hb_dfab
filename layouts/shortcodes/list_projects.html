<section class="portfolio-grid">
  {{  := site.GetPage "/projects" }}
  {{ with  }}
    {{ range .Pages }}
      {{ if eq .Parent  }}
        <div class="project-card">
          <a href="{{ .RelPermalink }}">
            <div class="image-container">
              {{ if .Params.image }}
                <img src="{{ .Params.image }}" alt="{{ .Title }}">
              {{ end }}
            </div>
            <h3>{{ .Title }}</h3>
            <p>{{ .Params.description }}</p>
          </a>
        </div>
      {{ end }}
    {{ end }}
  {{ end }}
</section>
